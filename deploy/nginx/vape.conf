# ============================================================
# Vape Project — Nginx
#
# Host público provisório via sslip.io (sem domínio próprio): o DNS do
# sslip.io resolve `vape.2-24-122-160.sslip.io` para 2.24.122.160 sozinho.
# Para migrar para domínio próprio, basta trocar o server_name e reemitir
# o certificado — nada mais nesta configuração muda.
# ============================================================

# Limita tentativas de login na borda, antes de chegar ao Django.
limit_req_zone $binary_remote_addr zone=vape_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vape.2-24-122-160.sslip.io;

    # Espaço para o desafio do certbot; todo o resto vai para HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` só existe a partir do Nginx 1.25; esta VPS roda 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vape.2-24-122-160.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/vape.2-24-122-160.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vape.2-24-122-160.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---------- Cabeçalhos de segurança ----------
    # Repetidos via include em todo location que tenha `add_header` próprio —
    # ver o comentário em snippets/vape-seguranca.conf.
    include snippets/vape-seguranca.conf;

    # ---------- Limites ----------
    client_max_body_size 10M;
    # Timeouts folgados: relatório pesado numa VPS de 1 vCPU pode demorar.
    proxy_connect_timeout 15s;
    proxy_send_timeout    65s;
    proxy_read_timeout    65s;

    # ---------- Compressão ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml application/manifest+json;

    access_log /var/log/nginx/vape.access.log;
    error_log  /var/log/nginx/vape.error.log;

    # ---------- Frontend (SPA) ----------
    root /opt/vape-project/frontend/dist;
    index index.html;

    # Assets com hash no nome: imutáveis, cache longo.
    location /assets/ {
        include snippets/vape-seguranca.conf;
        # Só o add_header: com `expires` junto, o Cache-Control sairia duplicado.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # O `try_files` do location / faz redirect interno para cá, então é este
    # bloco que responde a página do sistema.
    location = /index.html {
        include snippets/vape-seguranca.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # A vitrine é pública mas não deve ser indexada: o link circula por
    # WhatsApp, não pelo buscador. O React manda a meta robots; este
    # cabeçalho cobre também os robôs que não executam JavaScript.
    location ^~ /vitrine/ {
        include snippets/vape-seguranca.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Reforço para o robô que ignora cabeçalho e lê só o arquivo.
    location = /robots.txt {
        include snippets/vape-seguranca.conf;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Qualquer rota desconhecida cai no index.html — o roteamento é do React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
    }

    # Login com limite mais apertado: é o alvo óbvio de força bruta.
    location = /api/auth/token/ {
        limit_req zone=vape_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django Admin (suporte) ----------
    location /admin/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Estáticos do Django (admin e drf-spectacular) ----------
    location /static/ {
        include snippets/vape-seguranca.conf;
        alias /opt/vape-project/backend/static_collected/;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Imagens enviadas pelo lojista. O backend converte tudo para JPEG antes
    # de gravar, então não há SVG nem HTML aqui — mas os cabeçalhos ficam
    # explícitos porque é o único diretório servido a partir de upload.
    location /media/ {
        include snippets/vape-seguranca.conf;
        alias /opt/vape-project/backend/media/;
        add_header Cache-Control "public, max-age=604800" always;
        # Nada aqui é executável; servir sempre como o tipo declarado.
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; }
        default_type application/octet-stream;
    }
}
