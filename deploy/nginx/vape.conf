# ============================================================
# Vape Project — Nginx
#
# Host público provisório via sslip.io (sem domínio próprio): o DNS do
# sslip.io resolve `vape.2-24-122-160.sslip.io` para 2.24.122.160 sozinho.
# Para migrar para domínio próprio, basta trocar o server_name e reemitir
# o certificado — nada mais nesta configuração muda.
# ============================================================

# Limita tentativas de login na borda, antes de chegar ao Django.
limit_req_zone $binary_remote_addr zone=vape_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vape.2-24-122-160.sslip.io;

    # Espaço para o desafio do certbot; todo o resto vai para HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` só existe a partir do Nginx 1.25; esta VPS roda 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vape.2-24-122-160.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/vape.2-24-122-160.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vape.2-24-122-160.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---------- Cabeçalhos de segurança ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- Limites ----------
    client_max_body_size 10M;
    # Timeouts folgados: relatório pesado numa VPS de 1 vCPU pode demorar.
    proxy_connect_timeout 15s;
    proxy_send_timeout    65s;
    proxy_read_timeout    65s;

    # ---------- Compressão ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml application/manifest+json;

    access_log /var/log/nginx/vape.access.log;
    error_log  /var/log/nginx/vape.error.log;

    # ---------- Frontend (SPA) ----------
    root /opt/vape-project/frontend/dist;
    index index.html;

    # Assets com hash no nome: imutáveis, cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Qualquer rota desconhecida cai no index.html — o roteamento é do React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
    }

    # Login com limite mais apertado: é o alvo óbvio de força bruta.
    location = /api/auth/token/ {
        limit_req zone=vape_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django Admin (suporte) ----------
    location /admin/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Estáticos do Django (admin e drf-spectacular) ----------
    location /static/ {
        alias /opt/vape-project/backend/static_collected/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/vape-project/backend/media/;
        expires 7d;
    }
}
