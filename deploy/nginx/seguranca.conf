# Cabeçalhos de segurança do Vape Project.
#
# Precisa ser um include repetido em cada `location` que declare seu próprio
# `add_header`: no Nginx, um `add_header` em nível de location **descarta**
# todos os herdados do `server`. Sem este include, a página principal da SPA
# (servida por `location = /index.html`, que define Cache-Control) sairia sem
# HSTS e sem X-Frame-Options.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Nada aqui pertence a buscador: o sistema é de uso interno e a vitrine
# circula por link direto, não por busca.
add_header X-Robots-Tag "noindex, nofollow" always;
