name: CI

# Roda em todo push e PR na main. Falhou aqui, não vai para produção.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vape_teste
          POSTGRES_USER: vape
          POSTGRES_PASSWORD: vape
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://vape:vape@localhost:5432/vape_teste
      DJANGO_SECRET_KEY: chave-de-teste-sem-valor
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Migrações sem pendências
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        working-directory: backend
        run: pytest tests/ -q --cov=apps --cov-report=term-missing

      - name: Verificação de produção
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: exemplo.com
          CSRF_TRUSTED_ORIGINS: https://exemplo.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend — tipos e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Checagem de tipos
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npm run build
